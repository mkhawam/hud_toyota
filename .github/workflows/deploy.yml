# CI on every push/PR; deploy to the car's Pi (self-hosted runner, label
# hud-pi) on pushes to main or a manual dispatch. The deploy job just calls
# the Pi's own updater, which fetches, builds, restarts, health-checks, and
# rolls back on failure — so a red deploy job means the old build is still
# running in the car, not a bricked HUD.
name: CI + Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch or SHA; default = this commit)"
        required: false
        default: ""

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests + frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web

  deploy:
    name: Deploy to the Pi
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, ARM64, hud-pi]
    timeout-minutes: 25
    concurrency:
      group: hud-pi
      cancel-in-progress: false
    steps:
      - name: Update the HUD in place
        run: sudo /opt/hud/deploy/update.sh --ref "${{ github.event.inputs.ref || github.sha }}"

      - name: Report
        if: always()
        run: |
          echo "### HUD on $(hostname)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git -C /opt/hud log -1 --format='%h %s (%cr)' >> "$GITHUB_STEP_SUMMARY"
          systemctl is-active hud-server hud-kiosk 2>/dev/null | paste -sd' ' >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
